<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GradInsight - 高校数据分析平台</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/vue@3.2.37/dist/vue.global.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>
    <div id="app">
        <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
            <div class="container">
                <a class="navbar-brand" href="/">
                    <img src="/static/img/logo.svg" alt="GradInsight Logo" height="30" class="d-inline-block align-text-top me-2">
                    GradInsight
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav me-auto">
                        <li class="nav-item">
                            <a class="nav-link" @click.prevent="navigateTo('/')" :class="{ active: currentPage === 'home' }" style="cursor: pointer;">首页</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" @click.prevent="navigateTo('/posts')" :class="{ active: currentPage === 'posts' }" style="cursor: pointer;">高校数据</a>
                        </li>
                        <li class="nav-item" v-if="isAdmin">
                            <a class="nav-link" @click.prevent="navigateTo('/tasks')" :class="{ active: currentPage === 'tasks' }" style="cursor: pointer;">爬虫任务</a>
                        </li>
                        <li class="nav-item" v-if="isAdmin">
                            <a class="nav-link" @click.prevent="navigateTo('/crawler')" :class="{ active: currentPage === 'crawler' }" style="cursor: pointer;">启动爬虫</a>
                        </li>
                    </ul>
                    <!-- 未登录状态显示登录注册按钮 -->
                    <div class="d-flex" v-if="!user">
                        <a @click.prevent="navigateTo('/login')" class="btn btn-outline-light me-2" style="cursor: pointer;">
                            <i class="bi bi-box-arrow-in-right me-1"></i>登录
                        </a>
                        <a @click.prevent="navigateTo('/register')" class="btn btn-light" style="cursor: pointer;">
                            <i class="bi bi-person-plus me-1"></i>注册
                        </a>
                    </div>
                    <!-- 已登录状态显示用户信息下拉菜单 -->
                    <div class="dropdown" v-else>
                        <a class="nav-link dropdown-toggle text-white d-flex align-items-center" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="bi bi-person-circle me-1" style="font-size: 1.2rem;"></i>
                            <span>${ user.username }</span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><span class="dropdown-item-text">
                                <i class="bi bi-person-badge me-1"></i>
                                角色: ${ user.role === 'admin' ? '管理员' : '普通用户' }
                            </span></li>
                            <li><span class="dropdown-item-text">
                                <i class="bi bi-envelope me-1"></i>
                                邮箱: ${ user.email }
                            </span></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="#" @click.prevent="logout">
                                <i class="bi bi-box-arrow-right me-1"></i>
                                退出登录
                            </a></li>
                        </ul>
                    </div>
                </div>
            </div>
        </nav>

        <main class="container my-4">
            <component :is="currentComponent"
                       :user="user"
                       :is-admin="isAdmin"
                       :posts="posts"
                       :tasks="tasks"
                       @login="handleLogin"
                       @register="handleRegister"
                       @start-crawl="startCrawl"></component>
        </main>

        <footer class="bg-light py-4 mt-4">
            <div class="container text-center">
                <p>© 2025 GradInsight 高校数据分析平台 | 版权所有</p>
            </div>
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/api.js"></script>
    <script src="/static/js/components.js"></script>
    <script src="/static/js/app.js"></script>
</body>
</html>
