<svg xmlns="http://www.w3.org/2000/svg" width="280" height="64" viewBox="0 0 280 64">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#a855f7"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
  </defs>

  <!-- 毕业帽 -->
  <g transform="translate(10,6)">
    <!-- 帽顶 -->
    <path d="M2 26 L26 14 L50 26 L26 19 Z" fill="url(#g1)" stroke="#4f46e5" stroke-width="1" stroke-linejoin="round"/>
    <!-- 帽顶装饰线 -->
    <line x1="26" y1="14" x2="26" y2="19" stroke="#4f46e5" stroke-width="1"/>
    <!-- 帽上的流苏 -->
    <line x1="26" y1="14" x2="36" y2="8" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="36" cy="7" r="3" fill="#fbbf24" stroke="#f59e0b" stroke-width="0.5"/>
    <!-- 帽身 -->
    <rect x="20" y="26" width="12" height="16" rx="2" fill="#4f46e5"/>
    <!-- 帽板 -->
    <ellipse cx="26" cy="44" rx="16" ry="4" fill="url(#g2)" stroke="#4f46e5" stroke-width="0.5"/>
  </g>

  <!-- 主标题 -->
  <text x="68" y="38" font-family="'Segoe UI',-apple-system,Arial" font-weight="800" font-size="28" fill="url(#g2)">GradInsight</text>

  <!-- 副标题 -->
  <text x="70" y="55" font-family="'Segoe UI',-apple-system,Arial" font-weight="400" font-size="12" fill="#94a3b8">高校数据分析平台</text>
</svg>
