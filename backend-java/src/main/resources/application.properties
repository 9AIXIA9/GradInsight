server.port=8080

# 数据库示例配置，按需替换
spring.datasource.url=jdbc:mysql://localhost:3306/gradinsight?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=changeit
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Python 分析服务地址示例
analysis.service.url=http://localhost:5000

# JWT secret (must be at least 32 bytes). 请在生产环境替换为安全值
jwt.secret=change_this_secret_to_a_long_random_value_at_least_32_chars!

# Crawler gRPC 配置
crawler.grpc.host=localhost
crawler.grpc.port=8999

# Actuator
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

