# ===========================================
# GradInsight Java Backend — 配置
# ===========================================
# 所有值支持环境变量覆盖（通过 .env 或系统环境变量）
# 格式: ${ENV_VAR:默认值}
#
# 优先级: 系统环境变量 > .env 文件 > application.properties 默认值
# ===========================================

# ---- 服务器 ----
server.port=${SERVER_PORT:8080}

# ---- MySQL 数据库 ----
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/gradinsight?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:changeit}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}

# ---- Python 分析微服务 ----
analysis.service.url=${ANALYSIS_SERVICE_URL:http://localhost:5000}

# ---- JWT ----
# 生产环境务必替换为至少 32 字符的随机字符串
jwt.secret=${JWT_SECRET:change_this_secret_to_a_long_random_value_at_least_32_chars!}

# ---- Go 爬虫 gRPC ----
crawler.grpc.host=${CRAWLER_GRPC_HOST:localhost}
crawler.grpc.port=${CRAWLER_GRPC_PORT:8999}

# ---- Actuator ----
management.endpoints.web.exposure.include=${ACTUATOR_EXPOSE:*}
management.endpoint.health.show-details=${ACTUATOR_HEALTH_DETAILS:always}

# ---- Flyway ----
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=${FLYWAY_LOCATIONS:classpath:db/migration}

# ---- CORS ----
# 多个来源用逗号分隔
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
